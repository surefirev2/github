# Hub-local. Do not template-sync this file — downstream repos already
# have their own pre-commit / Husky stacks.
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: openlore-preflight
        name: OpenLore graph freshness
        entry: scripts/openlore-preflight.sh
        language: script
        pass_filenames: false
        # Only run when files that affect the OpenLore graph change — skip docs, demos,
        # and other non-indexed changes to keep commits fast. Excludes .pre-commit-config.yaml
        # so updating this config doesn't trigger the hook on itself.
        files: |
          ^(Makefile|package\.json|package-lock\.json|uv\.lock|
            \.openlore/config\.json|\.openlore/index-bundle\.olbundle|scripts/.*\.sh|
            .github/workflows/openlore.*\.yml|\.github/openlore-config\.json)$

      - id: openlore-enforce
        name: openlore enforce
        entry: openlore enforce --hook
        language: system
        pass_filenames: false
        files: \\.(ya?ml|md|json)$
