# Additive: unique filename, safe to template-sync.
# Enforces that application repos opt into surefirev2/github pre-commit hooks.
# Does NOT overwrite .pre-commit-config.yaml — only validates the parent call.
#
# Skip on the hub itself (it publishes hooks; it does not consume them remotely).
name: pre-commit-upstream-required

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pre-commit-upstream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  upstream-required:
    name: pre-commit upstream required
    if: github.repository != 'surefirev2/github'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install PyYAML
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml

      - name: Require surefirev2/github pre-commit opt-in
        run: python3 scripts/check-pre-commit-upstream-required.py
