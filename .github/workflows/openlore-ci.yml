# Additive OpenLore governance CI. Safe to template-sync: unique filename.
# Advisory findings do not fail the job. Fail only if the CLI crashes.
#
# Prefer a repo-local .openlore/config.json (never template-synced). Fall back
# to the org starter at .github/openlore-config.json so analyze can run before
# a repo has run `openlore init`.
name: openlore-ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: openlore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  openlore:
    name: openlore-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13'

      - name: Resolve OpenLore config
        id: openlore-config
        run: bash scripts/resolve-openlore-config.sh >> "$GITHUB_OUTPUT"

      - name: Analyze
        run: npx --yes openlore@2.1.8 analyze --no-embed --config "${{ steps.openlore-config.outputs.config }}"

      - name: Enforce (advisory)
        run: npx --yes openlore@2.1.8 enforce --config "${{ steps.openlore-config.outputs.config }}"
