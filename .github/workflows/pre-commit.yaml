# Hub hygiene + semantic PR titles. OpenLore analyze/enforce lives in
# openlore-ci.yml (syncable). automerge-gate/all-passed waits for both.
name: pre-commit

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-pr-title:
    name: Validate PR titles
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'pull[bot]' }}
    permissions:
      pull-requests: read
      contents: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: openlore-enforce

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint-pr-title, pre-commit]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check required jobs passed
        env:
          TITLE: ${{ needs.lint-pr-title.result }}
          PRECOMMIT: ${{ needs.pre-commit.result }}
        run: |
          if [ "$TITLE" != "success" ] && [ "$TITLE" != "skipped" ]; then
            echo "Validate PR titles failed ($TITLE)"
            exit 1
          fi
          if [ "$PRECOMMIT" != "success" ]; then
            echo "pre-commit failed ($PRECOMMIT)"
            exit 1
          fi
          echo "Required hygiene jobs passed"
