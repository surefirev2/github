# OpenLore structural PR review — posts ONE sticky comment (advisory).
# Pin the composite to the published v2.1.8 commit. Never use pull_request_target.
#
# Fork PRs: GITHUB_TOKEN is read-only, so the comment step warns and continues.
name: OpenLore review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: openlore-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  openlore-review:
    name: OpenLore review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: clay-good/OpenLore/.github/actions/openlore-review@a46412ddf9759c2b308a6f2132ae1cb41b57ef9f # v3.1.0
        with:
          head: ${{ github.event.pull_request.head.sha }}
          analyze: 'true'
          gate: 'false'
