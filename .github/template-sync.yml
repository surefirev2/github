# Pilot + OpenLore distribution.
# OpenLore workflows are additive (unique filenames). automerge-gate stays
# barn-league-hockey-only via repo_include_paths.
#
# repo-sync-action opens PRs in targets; it does not push to default branches.
repositories:
  - barn-league-hockey
  - hockeymind
  - math-desktop
  - math_spike2

include_paths:
  - .github/workflows/openlore-review.yml
  - .github/workflows/openlore-ci.yml

repo_include_paths:
  barn-league-hockey:
    - .github/workflows/automerge-gate.yml

exclude_paths: []
